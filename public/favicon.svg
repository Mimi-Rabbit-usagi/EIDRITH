<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0e17"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#3a3a6e" stroke-width="1"/>

  <!-- パープルグロー -->
  <ellipse cx="16" cy="19" rx="11" ry="9" fill="#6c63ff" opacity="0.22" filter="url(#glow)"/>

  <!-- キング駒（クリーム〜ラベンダーグラデ） -->
  <!-- クロス縦 -->
  <rect x="14.5" y="3" width="3" height="9.5" rx="1.2" fill="url(#piece)"/>
  <!-- クロス横 -->
  <rect x="10.5" y="6" width="11" height="2.8" rx="1.2" fill="url(#piece)"/>

  <!-- クラウン（3つの山） -->
  <path d="M7.5,20.5 L9.5,12 L13,16.5 L16,12 L19,16.5 L22.5,12 L24.5,20.5 Z"
        fill="url(#piece)"/>

  <!-- ボディ（台形） -->
  <path d="M7.5,20.5 L9.5,25.5 L22.5,25.5 L24.5,20.5 Z"
        fill="url(#piece)"/>

  <!-- ベース -->
  <rect x="6.5" y="25.5" width="19" height="2.5" rx="1.2" fill="url(#piece)"/>

  <!-- パープルアクセント -->
  <rect x="5.5" y="28" width="21" height="2.5" rx="1.25" fill="#6c63ff" opacity="0.95"/>
</svg>
