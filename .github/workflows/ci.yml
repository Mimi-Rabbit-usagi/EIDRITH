name: CI

# main への push と、すべての Pull Request で実行する。
# push を全ブランチ対象にすると PR ごとに二重で走ってしまうため main のみに絞る。
on:
  push:
    branches: [main]
  pull_request:

# 中身を読むだけなので書き込み権限は与えない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm install ではなく npm ci を使う。
      # package-lock.json の通りに厳密にインストールするので、手元と同じ結果が再現できる。
      - name: 依存関係のインストール
        run: npm ci

      # 速く落ちるものから順に実行する
      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
